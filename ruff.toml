# Configuração do ruff para o Nexus Defense AI.
# Lint documentado no CLAUDE.md: `venv/bin/ruff check .`

extend-exclude = ["venv"]

[lint.per-file-ignores]
# agents/nexus_agent.py importa `network_devices` e `bgp_flowspec` no MEIO do
