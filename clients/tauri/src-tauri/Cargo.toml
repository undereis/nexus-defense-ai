[package]
name = "nexus-client"
version = "0.1.0"
description = "Cliente desktop do Nexus Defense AI (consome a API REST do motor Python)"
authors = ["Xfiber"]
edition = "2021"

[lib]
name = "nexus_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
